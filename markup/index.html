<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Абушахманова Айгуль</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <!-- Добавляем класс для поиска в JS -->
    <header class="app-header">
        <h1>Менеджер подписок и сервисов</h1>
    </header>

    <main>
        <!-- Добавляем класс для поиска в JS -->
        <div class="sidebar sidebar-section">
            <div class="filters">
                <h2>Фильтры</h2>
                
                <div class="filter-group">
                    <h3>Тип подписки</h3>
                    <!-- Добавляем value для корректной работы фильтров -->
                    <label><input type="checkbox" value="Стриминг" checked> Стриминг</label>
                    <label><input type="checkbox" value="Музыка" checked> Музыка</label>
                    <label><input type="checkbox" value="ПО" checked> ПО</label>
                    <label><input type="checkbox" value="Игры" checked> Игры</label>
                    <label><input type="checkbox" value="Другое" checked> Другое</label>
                </div>
                
                <div class="filter-group">
                    <h3>Стоимость</h3>
                    <input type="range" class="price-slider" min="1" max="5000" value="2000">
                    <div class="range-values">
                        <div class="min-value">1 ₽</div>
                        <div class="max-value">2 000 ₽</div>
                    </div>
                </div>
            </div>
            
            <!-- Статистика будет генерироваться JavaScript -->
            <div class="stats">
                <!-- JavaScript вставит сюда динамическую статистику -->
            </div>
        </div>

        <!-- Добавляем класс для поиска в JS -->
        <div class="main-content main-content-section">
            <!-- ВСЁ ЭТО СОДЕРЖИМОЕ БУДЕТ ЗАМЕНЕНО JavaScript -->
            <!-- Удаляем статический контент или оставляем как fallback -->
            
        </div>
    </main>

    <!-- Подключаем JavaScript -->
    <script type="module" src="main.js"></script>
</body>
</html>
